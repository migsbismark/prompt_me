services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/git/prompt_me
    working_dir: /workspaces/git/prompt_me
    command: sleep infinity
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b

  ollama:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.ollama
    container_name: prompt_me_ollama
    volumes:
      - ollama_data:/root/.ollama
    command: serve

volumes:
  ollama_data:
